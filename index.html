<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Virtual Classroom 3D</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark navbar-custom py-2">
        <div class="container-fluid d-flex justify-content-center">
            <span class="navbar-brand mb-0 h4 fw-bold text-light" style="letter-spacing: 1px;">
                VIRTUAL CLASSROOM 3D
            </span>
        </div>
    </nav>
    
    <!-- Contenedor -->
    <div id="contenedor3D" class="position-relative">
    
    <div id="instrucciones" class="position-absolute top-0 start-0 m-3 p-3 bg-dark text-white rounded bg-opacity-75" style="z-index: 10; width: 250px; pointer-events: auto;">
        <h5 class="text-center text-info mb-3">Controles del Aula</h5>
        
        <div id="controles-fijos">
            <p class="mb-2"><span class="me-2">⌨️</span> <b>W, A, S, D</b> para caminar</p>
            <p class="mb-2"><span class="me-2">🖱️</span> <b>Mouse</b> para mirar</p>
            <hr class="border-light">
            <p class="mb-1 text-warning text-center"><b>(Presiona ESC para salir)</b></p>
        </div>

        <div id="click-prompter" class="text-center mt-3 p-2 bg-info rounded" style="cursor: pointer;">
             🖱️ <b>Click aquí</b> para entrar
        </div>
    </div>

</div>
