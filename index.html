<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Classroom 3D</title>

    <link rel="icon" href="data:,">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-dark navbar-custom py-2">
        <div class="container-fluid d-flex justify-content-center">
            <span class="navbar-brand mb-0 h4 fw-bold text-light" style="letter-spacing: 1px;">
                VIRTUAL CLASSROOM 3D
            </span>
        </div>
    </nav>

    <div id="contenedor3D" class="position-relative">
        
        <div id="instrucciones" class="position-absolute top-0 start-0 m-3 p-3 bg-dark text-white rounded shadow" style="z-index: 10; width: 260px; pointer-events: auto; background-color: rgba(33, 37, 41, 0.85) !important;">
            <h5 class="text-center text-info mb-3 fw-bold">Controles del Aula</h5>
            
            <div id="controles-fijos">
                <p class="mb-2"><span class="me-2 fs-5">⌨️</span> <b>W, A, S, D</b> para caminar</p>
                <p class="mb-2"><span class="me-2 fs-5">🖱️</span> <b>Mouse</b> para mirar</p>
                <hr class="border-light opacity-50">
                <p class="mb-1 text-warning text-center small"><b>(Presiona ESC para salir)</b></p>
            </div>

            <div id="click-prompter" class="text-center mt-3 p-2 bg-info text-dark rounded fw-bold shadow-sm" style="cursor: pointer; transition: 0.3s;">
                 🖱️ Click aquí para entrar
            </div>
        </div>

    </div>

    <footer class="footer-custom text-white text-center">
        <span class="text-light">
            Desarrollado por <b>Diana Denise Campos Lozano</b> | Ingeniería en ITIC
        </span>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="script.js"></script>

</body>
</html>
